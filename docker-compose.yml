services:
  postgres:
    image: postgres:16-alpine
    container_name: emenu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: emenu_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d emenu_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis is required by backend Settings (REDIS_URL)
  redis:
    image: redis:7-alpine
    container_name: emenu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
