[project]
name = "backend"
version = "0.1.0"
description = "អុី មីនុយ-E Menu API — Multi-tenant restaurant management backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi==0.140.13",
    "greenlet>=3.5.4",
    "httpx>=0.28.1",
    "phonenumbers>=9.0.36",
    "psycopg[binary]>=3.2.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "qrcode[pil]>=8.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]
